<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Support â€” Vistaraz</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #05080a;">
  <header class="site-header" style="background: transparent; border: none;">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Vistaraz — Innovate, Heal, Impact" height="48"></a>
    <span style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem;"><i class="fas fa-lock" style="margin-right: 5px;"></i> End-to-end encrypted</span>
  </header>

  <main style="padding-top: 20px; max-width: 1400px;">
    <div class="video-grid">
      <!-- Main Video Area -->
      <div class="main-video">
        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1000&q=80" alt="Professional listener" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.9;">
        
        <!-- Self Video PIP -->
        <div style="position: absolute; top: 20px; right: 20px; width: 200px; height: 150px; background: #222; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <div style="width: 100%; height: 100%; background: linear-gradient(135deg, #2c3e50, #000); display: grid; place-items: center; color: var(--text-muted);">
            <i class="fas fa-user" style="font-size: 2rem;"></i>
          </div>
        </div>

        <!-- Controls -->
        <div class="video-controls">
          <div class="control-btn"><i class="fas fa-microphone-slash"></i></div>
          <div class="control-btn"><i class="fas fa-video"></i></div>
          <div class="control-btn"><i class="fas fa-desktop"></i></div>
          <a class="control-btn end" href="support.html" title="End Call"><i class="fas fa-phone-slash"></i></a>
        </div>
      </div>

      <!-- Side Panel -->
      <div class="glass-card" style="padding: 20px; display: flex; flex-direction: column; background: rgba(255,255,255,0.02);">
        <div style="margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 20px;">
          <h3 style="font-family: var(--font-sans); font-size: 1.1rem; margin-bottom: 5px;">Dr. Sarah M.</h3>
          <span style="font-size: 0.75rem; color: var(--success);"><i class="fas fa-check-circle"></i> Verified Clinical Psychologist</span>
        </div>
        
        <div style="flex: 1; display: flex; flex-direction: column;">
          <h4 style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">Session Notes</h4>
          <textarea placeholder="Jot down anything important here. These stay private to you." style="flex: 1; resize: none; background: rgba(0,0,0,0.2);"></textarea>
        </div>

        <div style="margin-top: 20px; pt: 20px; border-top: 1px solid var(--line);">
          <button class="button ghost" style="width: 100%; font-size: 0.85rem;"><i class="fas fa-shield-alt" style="margin-right: 5px;"></i> Report Concern</button>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
