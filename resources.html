<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Library · Vistaraz</title>
  <script>try{var t=localStorage.getItem("vistaraz_theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}</script><link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="container section">
    <div class="page-hero">
      <div class="section-head">
        <span class="eyebrow">Practical support</span>
        <h2 data-i18n="resources.title">Support library</h2>
        <p data-i18n="resources.sub">Practical tools in Hindi, English, Marathi and Gujarati.</p>
      </div>

      <div class="tabs" style="justify-content:center; margin-bottom:20px">
        <button class="tab-btn active" id="enBtn" type="button">English</button>
        <button class="tab-btn" id="hiBtn" type="button">हिन्दी</button>
        <button class="tab-btn" id="mrBtn" type="button">मराठी</button>
        <button class="tab-btn" id="guBtn" type="button">ગુજરાતી</button>
      </div>

      <div class="chip-row" style="justify-content:center; margin-bottom:18px">
        <span class="chip">Sleep</span>
        <span class="chip">Exams</span>
        <span class="chip">Family</span>
        <span class="chip">Peer support</span>
        <span class="chip">Grounding</span>
      </div>

      <div class="cards" id="cards"></div>
    </div>
  </main>

  <footer>
    Vistaraz · विस्ताराज़. <span data-i18n="crisis.line">In crisis? 24x7 helplines</span>: <a href="crisis.html">14416</a>.
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    const DATA = {
      en: [
        { t: "3-minute breathing reset", d: "A simple box-breathing practice for before class, exams, or sleep.", tag: "Grounding" },
        { t: "Talking to parents about pressure", d: "Gentle scripts to open up without the conversation turning into conflict.", tag: "Family" },
        { t: "Exam week toolkit", d: "Practical steps for the night before and the day of the paper.", tag: "Academics" },
        { t: "Sleep reset basics", d: "Small habits that help your body wind down at night.", tag: "Sleep" },
        { t: "When a friend needs support", d: "How to listen without fixing — the basics of peer care.", tag: "Peer" }
      ],
      hi: [
        { t: "3-मिनट श्वास रीसेट", d: "क्लास, परीक्षा या नींद से पहले करने की आसान श्वास क्रिया।", tag: "ग्राउंडिंग" },
        { t: "माता-पिता से दबाव पर बात करना", d: "बिना बहस के बात शुरू करने की नरम स्क्रिप्ट।", tag: "परिवार" },
        { t: "परीक्षा सप्ताह टूलकिट", d: "पेपर से पहले और उसी दिन के लिए काम के कदम।", tag: "पढ़ाई" },
        { t: "नींद रीसेट के मूल नियम", d: "छोटी आदतें जो शरीर को रात में शांत करती हैं।", tag: "नींद" },
        { t: "जब दोस्त को सहारे की जरूरत हो", d: "ठीक किए बिना सुनना — साथ निभाने की शुरुआत।", tag: "साथी" }
      ],
      mr: [
        { t: "3-मिनिट श्वास रीसेट", d: "कुठेही चिंता कमी करण्याचा सोपा श्वास सराव.", tag: "ग्राउंडिंग" },
        { t: "आईवडिलांशी दबावावर बोलणे", d: "वाद न करता बोलायला सुरुवात करण्याचे नरम मार्ग.", tag: "कुटुंब" },
        { t: "परीक्षा सप्ताह टूलकिट", d: "पेपरपूर्वी आणि पेपरच्या दिवशी उपयोगी पायऱ्या.", tag: "शिक्षण" },
        { t: "झोप रीसेटची मूलतत्त्वे", d: "रात्री शरीर शांत व्हायला मदत करणाऱ्या छोट्या सवयी.", tag: "झोप" },
        { t: "मित्राला आधार हवा असेल तेव्हा", d: "दुरुस्त न करता ऐकणे — सोबतीची सुरुवात.", tag: "सोबती" }
      ],
      gu: [
        { t: "3-મિનિટ શ્વાસ રીસેટ", d: "ક્યાંય પણ ચિંતા ઓછી કરવા માટે સરળ શ્વાસ અભ્યાસ.", tag: "ગ્રાઉન્ડિંગ" },
        { t: "માતા-પિતા સાથે દબાણ વિશે વાત", d: "ઝઘડો કર્યા વિના વાત શરૂ કરવાની નરમ રીત.", tag: "પરિવાર" },
        { t: "પરીક્ષા સપ્તાહ ટૂલકિટ", d: "પેપર પહેલાં અને પેપરના દિવસે કામ લાગતા પગલાં.", tag: "અભ્યાસ" },
        { t: "ઊંઘ રીસેટની મૂળ બાબતો", d: "રાત્રે શરીરને શાંત થવામાં મદદ કરતી નાની આદતો.", tag: "ઊંઘ" },
        { t: "જ્યારે મિત્રને સહારો જોઈએ", d: "ઉકેલ્યા વગર સાંભળવું — સાથી કાળજીની શરૂઆત.", tag: "સાથી" }
      ]
    };

    function setLang(l){
      Vistaraz.i18n.setLang(l);
      const cards = document.getElementById("cards");
      cards.innerHTML = DATA[l].map(r => `
        <div class="card"><div class="step">${r.tag}</div><h3>${r.t}</h3><p>${r.d}</p></div>`).join("");
        document.getElementById("enBtn").className = l==="en"?"tab-btn active":"tab-btn";
        document.getElementById("hiBtn").className = l==="hi"?"tab-btn active":"tab-btn";
        document.getElementById("mrBtn").className = l==="mr"?"tab-btn active":"tab-btn";
        document.getElementById("guBtn").className = l==="gu"?"tab-btn active":"tab-btn";
    }
      document.getElementById("enBtn").addEventListener("click", () => setLang("en"));
      document.getElementById("hiBtn").addEventListener("click", () => setLang("hi"));
      document.getElementById("mrBtn").addEventListener("click", () => setLang("mr"));
      document.getElementById("guBtn").addEventListener("click", () => setLang("gu"));
      setLang(Vistaraz.i18n.getLang());
  </script>
</body>
</html>
