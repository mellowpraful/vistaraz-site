<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thought Tools · Vistaraz</title>
  <script>try{var t=localStorage.getItem("vistaraz_theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}</script><link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="container section">
    <div class="page-hero">
      <div class="section-head">
        <span class="eyebrow">Self-guided support</span>
        <h2>Thought tools</h2>
        <p>Anonymous, evidence-informed exercises that help you slow down, reflect, and reset without turning the experience clinical.</p>
      </div>

      <div class="module-grid" style="margin-bottom:24px">
        <button class="module-card" type="button" data-tool="thought"><h3>Thought mapping</h3><p>Catch, name, and reframe the thought loop.</p></button>
        <button class="module-card" type="button" data-tool="gratitude"><h3>Small wins</h3><p>Note three good things that happened today.</p></button>
        <button class="module-card" type="button" data-tool="ground"><h3>5-4-3-2-1 reset</h3><p>Anchor to the present when everything feels loud.</p></button>
      </div>

      <div class="panel" id="panel" style="display:none"></div>
    </div>
  </main>

  <footer>
    Vistaraz · विस्ताराज़. <span data-i18n="crisis.line">In crisis? 24x7 helplines</span>: <a href="crisis.html">14416</a>.
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function show(mod){
      const p = document.getElementById("panel"); p.style.display="block"; p.scrollIntoView({behavior:"smooth"});
      if(mod==="thought"){
        p.innerHTML = `<h3>Thought mapping</h3>
          <p style="color:var(--text-muted)">Write a thought that keeps looping, then add a kinder, more balanced response.</p>
          <label>Situation / trigger</label><input class="field" id="t1" placeholder="e.g. failed a quiz">
          <label>Automatic thought</label><input class="field" id="t2" placeholder="e.g. I'm useless at everything">
          <label>Intensity (0-10)</label><input class="field" id="t3" type="number" min="0" max="10" value="7">
          <label>Balanced reframe</label><textarea class="field" id="t4" rows="2" placeholder="e.g. one quiz doesn't define me; I can prepare differently"></textarea>
          <button class="btn btn-primary" style="margin-top:12px" id="saveThought" type="button">Save reflection</button>`;
        setTimeout(() => document.getElementById("saveThought")?.addEventListener("click", () => Vistaraz.common.toast('Saved to your private record')), 0);
      } else if(mod==="gratitude"){
        p.innerHTML = `<h3>Small wins</h3><p style="color:var(--text-muted)">Three small things that went okay today:</p>
          <input class="field" id="g1" placeholder="1."><input class="field" id="g2" placeholder="2."><input class="field" id="g3" placeholder="3.">
          <button class="btn btn-primary" style="margin-top:12px" id="saveWins" type="button">Save</button>`;
        setTimeout(() => document.getElementById("saveWins")?.addEventListener("click", () => Vistaraz.common.toast('Small wins logged 💚')), 0);
      } else {
        p.innerHTML = `<h3>5-4-3-2-1 reset</h3><p style="color:var(--text-muted)">Notice around you, slowly:</p>
          <div class="ground-grid">
            <div class="ground-item"><strong>5</strong> things you see</div>
            <div class="ground-item"><strong>4</strong> things you can touch</div>
            <div class="ground-item"><strong>3</strong> things you hear</div>
            <div class="ground-item"><strong>2</strong> things you smell</div>
            <div class="ground-item"><strong>1</strong> thing you taste</div>
            <div class="ground-item">Breathe. You are here. 💚</div>
          </div>`;
      }
    }

    document.querySelectorAll("[data-tool]").forEach(card => card.addEventListener("click", () => show(card.getAttribute("data-tool"))));
  </script>
</body>
</html>
