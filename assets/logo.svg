<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6633ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Medical Cross outline (rounded) -->
  <rect x="140" y="60" width="60" height="170" rx="14" ry="14" fill="none" stroke="url(#crossGrad)" stroke-width="8"/>
  <rect x="80" y="120" width="170" height="60" rx="14" ry="14" fill="none" stroke="url(#crossGrad)" stroke-width="8"/>

  <!-- Leaf inside cross -->
  <path d="M175 110 C155 130 145 165 175 185 C205 165 215 130 175 110Z" fill="url(#leafGrad)" opacity="0.9"/>
  <line x1="175" y1="185" x2="175" y2="215" stroke="url(#leafGrad)" stroke-width="3"/>

  <!-- Stethoscope curve right arm -->
  <path d="M210 148 Q240 148 248 162 Q255 175 248 185 A12 12 0 1 1 235 178" fill="none" stroke="url(#crossGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- VISTARAZ wordmark -->
  <text x="200" y="280" font-family="'Arial', sans-serif" font-size="42" font-weight="700" letter-spacing="10" fill="white" text-anchor="middle">VISTARAZ</text>

  <!-- Tagline -->
  <line x1="68" y1="308" x2="105" y2="308" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="200" y="313" font-family="'Arial', sans-serif" font-size="11" letter-spacing="4" fill="#aaaaaa" text-anchor="middle">INNOVATE • HEAL • IMPACT</text>
  <line x1="295" y1="308" x2="332" y2="308" stroke="#7c4dff" stroke-width="1.5"/>
</svg>
